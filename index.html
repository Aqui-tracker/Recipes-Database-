<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqui Cal-Mex · Bar Recipes</title>
<style>
:root {
  --bg:    #0d0d0d;
  --bg2:   #141414;
  --bg3:   #1c1c1c;
  --bg4:   #232323;
  --bg5:   #2a2a2a;
  --gold:  #c9a84c;
  --gold2: #e0bc6a;
  --text:  #f0ece4;
  --muted: #7a7a7a;
  --dim:   #4a4a4a;
  --border:#242424;
  --red:   #c44040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}

/* ── HEADER ── */
header{background:var(--bg2);border-bottom:2px solid var(--gold);padding:14px 24px;position:sticky;top:0;z-index:300}
.hdr{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{font-size:1.6rem;line-height:1}
.brand-text h1{font-size:1.15rem;color:var(--gold);font-weight:700;letter-spacing:.04em;line-height:1.2}
.brand-text p{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn-gold{background:var(--gold);color:#0d0d0d}
.btn-gold:hover{background:var(--gold2)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-outline:hover{background:rgba(201,168,76,.1)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--dim)}
.btn-red{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-red:hover{background:rgba(196,64,64,.1)}
.btn-sm{padding:4px 10px;font-size:.74rem}

/* ── TABS ── */
.tab-bar-wrap{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:200}
.tab-bar{max-width:1300px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:13px 18px;font-size:.8rem;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit;letter-spacing:.02em}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab .cnt{display:inline-block;background:var(--bg4);border-radius:10px;padding:1px 7px;font-size:.65rem;margin-left:5px;color:var(--muted)}
.tab.active .cnt{background:rgba(201,168,76,.2);color:var(--gold)}

/* ── MAIN ── */
.main{max-width:1300px;margin:0 auto;padding:22px 22px 70px}

/* ── SECTION HEADER ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-hdr-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.section-title{font-size:1.1rem;font-weight:700;color:var(--text)}
.section-sub{font-size:.76rem;color:var(--muted)}
.search-wrap{position:relative}
.search-wrap input{padding:7px 12px 7px 34px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.82rem;font-family:inherit;width:220px}
.search-wrap input:focus{outline:none;border-color:var(--gold);width:260px}
.search-wrap input{transition:width .2s}
.s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* ── CARD ── */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:15px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 20px rgba(201,168,76,.1)}
.card-top-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
.card-name{font-size:.88rem;font-weight:600;line-height:1.35;flex:1}
.card-offmenu{opacity:.65}
.card-offmenu .card-name{text-decoration:line-through;color:var(--muted)}
.menu-badge{border:none;border-radius:20px;padding:2px 7px;font-size:.62rem;font-weight:700;cursor:default;white-space:nowrap;flex-shrink:0}
.menu-badge.on{background:rgba(34,139,34,.15);color:#228b22;cursor:pointer}
.menu-badge.off{background:rgba(150,150,150,.15);color:#888;cursor:pointer}
.card-yield{font-size:.72rem;color:var(--muted);margin-bottom:8px}
.card-ings{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px}
.card-ings span{background:var(--bg4);border-radius:3px;padding:1px 6px;font-size:.68rem;color:var(--dim)}
.card-ings .tag-more{color:var(--gold);background:rgba(201,168,76,.08);border-radius:3px;padding:1px 6px;font-size:.68rem}
.card-footer{padding-top:9px;border-top:1px solid var(--border);display:flex;gap:5px}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:.25}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:500;overflow-y:auto;padding:20px}
.overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--bg4);border:1px solid var(--border);border-radius:12px;width:100%;max-width:740px;margin:auto}
.mhdr{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mhdr h2{font-size:.95rem;color:var(--gold);font-weight:700}
.mx{background:none;border:none;color:var(--muted);font-size:1.35rem;cursor:pointer;line-height:1;padding:0 2px}
.mx:hover{color:var(--text)}
.mbody{padding:22px}
.mftr{padding:13px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ── RECIPE VIEW ── */
.view-name{font-size:1.3rem;font-weight:700;margin-bottom:7px;line-height:1.3}
.view-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--muted);margin-bottom:18px}
.view-meta b{color:var(--text)}
.view-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:520px){.view-cols{grid-template-columns:1fr}}
.vsec h3{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-bottom:10px}
.ing-list{list-style:none}
.ing-list li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.83rem}
.ing-list li:last-child{border:none}
.ing-amt{color:var(--gold);font-weight:700;white-space:nowrap;min-width:60px}
.step-list{list-style:none;counter-reset:s}
.step-list li{counter-increment:s;position:relative;padding:6px 0 6px 28px;border-bottom:1px solid var(--border);font-size:.82rem;line-height:1.45}
.step-list li:last-child{border:none}
.step-list li::before{content:counter(s);position:absolute;left:0;top:7px;background:var(--gold);color:#0d0d0d;width:18px;height:18px;border-radius:50%;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.view-note{margin-top:14px;padding:9px 13px;background:rgba(201,168,76,.07);border-left:3px solid var(--gold);border-radius:0 5px 5px 0;font-size:.8rem;color:var(--muted);line-height:1.5}

/* ── FORM ── */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.84rem;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}
.fg textarea{min-height:66px;resize:vertical}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:460px){.fg-row{grid-template-columns:1fr}}

/* ── INGREDIENT EDITOR ── */
.ie{background:var(--bg3);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.ie-hdr{display:grid;grid-template-columns:72px 68px 1fr 24px;gap:6px;padding:5px 8px;background:var(--bg2)}
.ie-hdr span{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.ir{display:grid;grid-template-columns:72px 68px 1fr 24px;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center}
.ir:last-child{border:none}
.ir input{padding:5px 7px;background:var(--bg4);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.78rem;width:100%;font-family:inherit}
.ir input:focus{outline:none;border-color:var(--gold)}
.rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:.95rem;padding:2px;line-height:1;opacity:.6}
.rm:hover{opacity:1}
.ie-add{width:100%;padding:7px;background:none;border:none;border-top:1px solid var(--border);color:var(--gold);cursor:pointer;font-size:.76rem;font-weight:600;font-family:inherit}
.ie-add:hover{background:rgba(201,168,76,.05)}

/* ── STEPS EDITOR ── */
.se{background:var(--bg3);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.sr{display:grid;grid-template-columns:20px 1fr 24px;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);align-items:center}
.sr:last-child{border:none}
.snum{width:18px;height:18px;background:var(--gold);color:#0d0d0d;border-radius:50%;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr input{padding:5px 7px;background:var(--bg4);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.78rem;width:100%;font-family:inherit}
.sr input:focus{outline:none;border-color:var(--gold)}
.se-add{width:100%;padding:7px;background:none;border:none;border-top:1px solid var(--border);color:var(--gold);cursor:pointer;font-size:.76rem;font-weight:600;font-family:inherit}
.se-add:hover{background:rgba(201,168,76,.05)}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--bg4);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:7px;font-size:.82rem;z-index:9999;transform:translateY(70px);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

/* ── ADMIN LOCK ── */
.lock-btn{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 13px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px}
.lock-btn:hover{border-color:var(--gold);color:var(--gold)}
.lock-btn.unlocked{color:var(--gold);border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.07)}

/* PIN MODAL */
.pin-modal{background:var(--bg4);border:1px solid var(--border);border-radius:12px;width:100%;max-width:340px;margin:auto}
.pin-title{font-size:.95rem;color:var(--gold);font-weight:700}
.pin-input-wrap{margin:18px 0}
.pin-input-wrap input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:1.2rem;font-family:inherit;text-align:center;letter-spacing:.25em}
.pin-input-wrap input:focus{outline:none;border-color:var(--gold)}
.pin-error{color:var(--red);font-size:.76rem;text-align:center;min-height:18px;margin-top:-10px;margin-bottom:8px}
.pin-change{font-size:.73rem;color:var(--muted);text-align:center;margin-top:10px}
.pin-change a{color:var(--gold);cursor:pointer;text-decoration:underline}

/* ── PRINT STYLES ── */
@media print{
  body{background:#fff!important;color:#111!important}
  header,.tab-bar-wrap,.section-hdr,.card-footer,.mftr,
  .overlay:not(#printOverlay),.toast{display:none!important}
  #printOverlay{display:block!important;position:static;background:#fff;padding:0}
  .modal{border:none;max-width:100%;box-shadow:none;background:#fff}
  .mhdr,.mx{display:none!important}
  .mbody{padding:0}
  .view-name{color:#111;font-size:1.5rem}
  .view-meta{color:#444}
  .view-meta b{color:#111}
  .vsec h3{color:#111;border-bottom:1px solid #ccc;padding-bottom:3px}
  .ing-list li,.step-list li{border-color:#ddd;color:#111}
  .ing-amt{color:#111}
  .step-list li::before{background:#111;color:#fff}
  .view-note{background:#f9f6f0;border-left:2px solid #c9a84c;color:#444}
  .view-cols{grid-template-columns:1fr 1fr}
}

/* ════ BAR MENU TAB PANEL ════ */
#barMenuPanel {
  display: none;
  background: #d4c4a0;
  min-height: calc(100vh - 110px);
  padding: 20px;
}
.bm-toolbar {
  background: #3a2010;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  border-radius: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.bm-toolbar-title { flex:1; font-size:.85rem; color:#e8d9b8; letter-spacing:2px; text-transform:uppercase; font-family:Georgia,serif; }
.bm-btn { border:none; border-radius:6px; padding:6px 14px; font-size:.78rem; font-family:Arial,sans-serif; cursor:pointer; font-weight:600; }
.bm-btn:hover { opacity:.85; }
.bm-btn-edit   { background:#2563eb; color:#fff; }
.bm-btn-dl     { background:#16a34a; color:#fff; }
.bm-btn-reset  { background:#555;    color:#fff; }
.bm-edit-hint  { width:100%; font-size:.75rem; color:#fde68a; font-family:Arial,sans-serif; display:none; }
body.bm-editing .bm-edit-hint { display:block; }
body.bm-editing .bm-btn-edit  { background:#dc2626; }
.bm-page {
  max-width: 820px; margin: 0 auto 24px;
  background: #ffffff; padding: 36px 44px;
  border: 1px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  font-family: Georgia, serif;
}
@media(max-width:600px){ .bm-page{ padding:20px 14px; } }
.bm-section { margin: 24px 0; }
.bm-section-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.bm-section-line   { flex:1; height:1px; background:#6b4226; opacity:.35; }
.bm-section-title  { font-size:.72rem; font-weight:bold; letter-spacing:4px; text-transform:uppercase; color:#8b1a1a; white-space:nowrap; }
.bm-subsection-grid{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
.bm-subsection     { text-align:center; flex:1; min-width:110px; }
.bm-subsection-title{ font-weight:bold; font-size:.85rem; margin-bottom:5px; color:#3a2010; }
.bm-item-list      { text-align:center; }
.bm-menu-item      { display:flex; align-items:baseline; justify-content:center; gap:3px; line-height:1.6; }
.bm-item-name      { font-size:.83rem; color:#3a2010; }
.bm-split-row      { display:flex; gap:36px; justify-content:center; flex-wrap:wrap; }
.bm-split-row .bm-section { flex:1; min-width:170px; }
.bm-beer-grid      { display:grid; grid-template-columns:repeat(3,1fr); gap:6px 18px; text-align:center; }
.bm-wine-grid      { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; }
.bm-wine-sub-title { font-weight:bold; font-size:.8rem; margin-bottom:5px; color:#3a2010; }
.bm-cocktail-grid  { display:grid; grid-template-columns:repeat(3,1fr); gap:18px 22px; }
@media(max-width:560px){ .bm-cocktail-grid{ grid-template-columns:1fr; } }
.bm-cocktail-name  { font-weight:bold; font-size:.83rem; color:#3a2010; margin-bottom:3px; }
.bm-cocktail-desc  { font-size:.76rem; color:#5a3a20; line-height:1.5; }
.bm-logo-area      { text-align:center; margin-bottom:24px; }
.bm-logo-img       { display:block; margin:0 auto; max-width:260px; width:100%; height:auto; }
.bm-footer-note    { text-align:center; font-size:.66rem; color:#7a5a3a; margin-top:28px; }
.bm-edit-btn { display:none; border:none; border-radius:4px; padding:1px 6px; font-size:.65rem; cursor:pointer; font-family:Arial,sans-serif; margin-left:3px; }
body.bm-editing .bm-edit-btn { display:inline-block; }
.bm-edit-btn.del { background:#dc2626; color:#fff; }
.bm-edit-btn.edt { background:#2563eb; color:#fff; }
.bm-add-form { display:none; margin-top:7px; text-align:center; }
body.bm-editing .bm-add-form { display:flex; flex-direction:column; align-items:center; gap:4px; }
.bm-add-form input,.bm-add-form textarea { font-family:Georgia,serif; font-size:.8rem; padding:4px 8px; border:1px dashed #6b4226; border-radius:4px; background:#fdf8ec; width:88%; max-width:260px; }
.bm-add-form textarea { height:56px; resize:vertical; }
.bm-add-btn { background:#16a34a; color:#fff; border:none; border-radius:4px; padding:4px 12px; font-size:.76rem; cursor:pointer; font-family:Arial,sans-serif; }
#bmModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000; align-items:center; justify-content:center; }
#bmModal.open { display:flex; }
#bmModalBox { background:#fdf8ec; border:2px solid #6b4226; border-radius:8px; padding:22px; width:min(400px,90vw); display:flex; flex-direction:column; gap:10px; }
#bmModalBox h3 { font-size:.85rem; color:#3a2010; text-transform:uppercase; letter-spacing:2px; }
#bmModalBox label { font-size:.75rem; color:#6b4226; font-family:Arial,sans-serif; }
#bmModalBox input,#bmModalBox textarea { width:100%; font-family:Georgia,serif; font-size:.82rem; padding:5px 9px; border:1px solid #c4a96a; border-radius:4px; background:#fff; }
#bmModalBox textarea { height:72px; resize:vertical; }
.bm-modal-btns { display:flex; gap:8px; justify-content:flex-end; }
.bm-modal-btns button { border:none; border-radius:4px; padding:5px 16px; font-size:.8rem; cursor:pointer; font-family:Arial,sans-serif; font-weight:600; }
#bmModalSave   { background:#16a34a; color:#fff; }
#bmModalCancel { background:#aaa;    color:#fff; }
@media print {
  #barMenuPanel .bm-toolbar { display:none!important; }
  .bm-edit-btn,.bm-add-form { display:none!important; }
  .bm-page { box-shadow:none; border:none; }
}

</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">
      <div class="brand-logo">🍹</div>
      <div class="brand-text">
        <h1>Aqui Cal-Mex Bar Recipes</h1>
        <p>Campbell · Recipe Database</p>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="btn btn-gold" id="addRecipeBtn" onclick="openAdd()" style="display:none">＋ Add Recipe</button>
      <button class="btn btn-outline" onclick="exportJSON()">⬇ Export</button>
      <label class="btn btn-ghost" style="cursor:pointer">⬆ Import<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label>
      <button class="lock-btn" id="lockBtn" onclick="toggleAdmin()" title="Admin login">🔒 Admin</button>
    </div>
  </div>
</header>

<!-- TABS -->
<div class="tab-bar-wrap">
  <div class="tab-bar" id="tabBar"></div>
</div>

<div class="main">
  <div class="section-hdr">
    <div class="section-hdr-left">
      <div>
        <div class="section-title" id="sectionTitle"></div>
        <div class="section-sub" id="sectionSub"></div>
      </div>
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search…" oninput="render()">
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" id="printSectionBtn" onclick="printSection()">🖨 Print Section</button>
      <button class="btn btn-ghost" onclick="printAll()">🖨 Print All</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- VIEW MODAL -->
<div class="overlay" id="viewOverlay" onclick="closeIfBg(event,'viewOverlay')">
  <div class="modal">
    <div class="mhdr"><h2>Recipe Detail</h2><button class="mx" onclick="closeView()">✕</button></div>
    <div class="mbody" id="viewBody"></div>
    <div class="mftr" id="viewFtr"></div>
  </div>
</div>

<!-- EDIT/ADD MODAL -->
<div class="overlay" id="editOverlay" onclick="closeIfBg(event,'editOverlay')">
  <div class="modal">
    <div class="mhdr"><h2 id="editTitle">Add Recipe</h2><button class="mx" onclick="closeEdit()">✕</button></div>
    <div class="mbody">
      <div class="fg">
        <label>Recipe Name</label>
        <input type="text" id="eName" placeholder="e.g. 16oz - Classico Rocks">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>Category</label>
          <select id="eCat">
            <option value="Top Shelf Margaritas">Top Shelf Margaritas</option>
            <option value="Blended Margaritas">Blended Margaritas</option>

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let recipes = [];
let activeTab = CATS[0];
let editingId = null;

function loadData(){
  try{
    const s = localStorage.getItem('aqui_v4');
    recipes = s ? JSON.parse(s) : JSON.parse(JSON.stringify(SEED));
  }catch(e){ recipes = JSON.parse(JSON.stringify(SEED)); }
  // migrate: recipes without onMenu default to true
  recipes.forEach(r=>{ if(r.onMenu===undefined) r.onMenu=true; });
}
function saveData(){ localStorage.setItem('aqui_v4', JSON.stringify(recipes)); }
function nextId(){ return recipes.length ? Math.max(...recipes.map(r=>r.id))+1 : 1; }

function toggleOnMenu(id){
  if(!adminUnlocked) return;
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  r.onMenu = !r.onMenu;
  saveData(); render();
  showToast(r.onMenu ? '✓ Marked On Menu' : 'Marked Off Menu');
}

/* ════════════════════════════════════════
   TABS
════════════════════════════════════════ */
function buildTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = CATS.map(c=>{
    const cnt = recipes.filter(r=>r.category===c).length;
    return `<button class="tab${c===activeTab?' active':''}" onclick="switchTab('${c}')">
      ${c}<span class="cnt">${cnt}</span>
    </button>`;
  }).join('') + `<button class="tab${activeTab==='__barMenu__'?' active':''}" onclick="switchTab('__barMenu__')">🗒 Bar Menu</button>`;
}

function switchTab(cat){
  activeTab = cat;
  document.getElementById('searchInput').value = '';
  buildTabs();
  if(cat==='__barMenu__'){
    document.querySelector('.main').style.display='none';
    document.getElementById('barMenuPanel').style.display='block';
  } else {
    document.querySelector('.main').style.display='';
    document.getElementById('barMenuPanel').style.display='none';
    render();
  }
}

/* ════════════════════════════════════════
   RENDER
════════════════════════════════════════ */
function stripPrefix(s){
  return s.replace(/^(Mix - |Liquor - |Vodka - |Tequila - |Rum - |Whiskey - |Cognac - |Juice - |Puree - |Agua Fresca - |Drinks - |Spice - )/,'');
}

function render(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = recipes.filter(r=>{
    if(r.category !== activeTab) return false;
    if(!q) return true;
    return r.name.toLowerCase().includes(q) ||
      r.ingredients.some(i=>i.item.toLowerCase().includes(q));
  }).sort((a,b)=>a.name.localeCompare(b.name));

  document.getElementById('sectionTitle').textContent = activeTab;
  document.getElementById('sectionSub').textContent =
    q ? `${list.length} result${list.length!==1?'s':''} for "${q}"` :
    `${list.length} recipe${list.length!==1?'s':''}`;

  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🍸</div>
      ${q ? `No recipes match "<b>${q}</b>"` : 'No recipes in this section yet.'}<br>
      <button class="btn btn-gold" style="margin-top:14px" onclick="openAdd()">＋ Add Recipe</button></div>`;
    return;
  }

  grid.innerHTML = list.map(r=>{
    const onMenu = r.onMenu !== false;
    const topIngs = r.ingredients.slice(0,3)
      .map(i=>`<span>${stripPrefix(i.item)}</span>`).join('');
    const more = r.ingredients.length>3
      ? `<span class="tag-more">+${r.ingredients.length-3}</span>` : '';
    return `<div class="card${onMenu?'':' card-offmenu'}" onclick="viewRecipe(${r.id})">
      <div class="card-top-row">
        <div class="card-name">${r.name}</div>
        ${adminUnlocked
          ? `<button class="menu-badge ${onMenu?'on':'off'}" onclick="event.stopPropagation();toggleOnMenu(${r.id})" title="Toggle menu status">${onMenu?'✓ On Menu':'○ Off Menu'}</button>`
          : (onMenu?'':'<span class="menu-badge off">Off Menu</span>')
        }
      </div>
      <div class="card-yield">Yields: ${r.yields}</div>
      <div class="card-ings">${topIngs}${more}</div>
      <div class="card-footer" onclick="event.stopPropagation()">
        <button class="btn btn-outline btn-sm" onclick="viewRecipe(${r.id})">View</button>
        <button class="btn btn-ghost btn-sm" onclick="printOne(${r.id})">🖨</button>
        ${adminUnlocked ? `<button class="btn btn-ghost btn-sm" onclick="openEdit(${r.id})">✏️ Edit</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   VIEW
════════════════════════════════════════ */
function recipeHTML(r, forPrint=false){
  return `
    <div class="view-name">${r.name}</div>
    <div style="margin-bottom:10px;font-size:.72rem;color:${forPrint?'#555':'var(--muted)'};text-transform:uppercase;letter-spacing:.08em;font-weight:700">${r.category}</div>
    <div class="view-meta">
      <span>Yields: <b>${r.yields}</b></span>
      ${r.allergens?`<span>Allergens: <b>${r.allergens}</b></span>`:''}
      ${r.equipment?`<span>Equipment: <b>${r.equipment}</b></span>`:''}
    </div>
    <div class="view-cols">
      <div class="vsec">
        <h3>Ingredients</h3>
        <ul class="ing-list">
          ${r.ingredients.map(i=>`<li>
            <span class="ing-amt">${i.amount} ${i.unit}</span>
            <span>${i.item}</span>
          </li>`).join('')}
        </ul>
      </div>
      <div class="vsec">
        <h3>Instructions</h3>
        ${r.instructions.length
          ? `<ol class="step-list">${r.instructions.map(s=>`<li>${s}</li>`).join('')}</ol>`
          : '<p style="color:var(--muted);font-size:.82rem">No instructions recorded.</p>'
        }
      </div>
    </div>
    ${r.notes?`<div class="view-note">📝 <b>Note:</b> ${r.notes}</div>`:''}`;
}

function viewRecipe(id){
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('viewBody').innerHTML = recipeHTML(r);
  document.getElementById('viewFtr').innerHTML = `
    <button class="btn btn-ghost" onclick="closeView()">Close</button>
    <button class="btn btn-ghost" onclick="printOne(${r.id})">🖨 Print</button>
    ${adminUnlocked ? `<button class="btn btn-outline" onclick="closeView();openEdit(${r.id})">✏️ Edit</button>` : ''}
  `;
  document.getElementById('viewOverlay').classList.add('open');
}
function closeView(){ document.getElementById('viewOverlay').classList.remove('open'); }

/* ════════════════════════════════════════
   PRINT — single recipe
════════════════════════════════════════ */
function printOne(id){
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  openPrintWindow([r], r.name);
}

/* ════════════════════════════════════════
   PRINT — whole section
════════════════════════════════════════ */
function printSection(){
  const list = recipes.filter(r=>r.category===activeTab).sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ showToast('No recipes in this section'); return; }
  openPrintWindow(list, activeTab);
}

function printAll(){
  const list = [...recipes].sort((a,b)=>
    CATS.indexOf(a.category)-CATS.indexOf(b.category) || a.name.localeCompare(b.name)
  );
  if(!list.length){ showToast('No recipes found'); return; }
  openPrintWindow(list, 'All Recipes');
}

  const OFF_MENU = {bg:'#666', light:'#f4f4f4', border:'#999'};
  const DEFAULT_COLOR = {bg:'#333', light:'#f5f5f5', border:'#888'};

  // Group by category in CATS order
  const grouped = {};
  list.forEach(r=>{ (grouped[r.category] = grouped[r.category]||[]).push(r); });
  const cats = CATS.filter(c=>grouped[c] && grouped[c].length);

  // Assign each ingredient to the step it belongs in.
  // Tier 1: full name match. Tier 2: strip "Category - " prefix. Tier 3: 2+ significant words (5+ chars).
  function assignIngredients(r) {
    const stepIngs = r.instructions.map(()=>[]);
    const assigned = new Array(r.ingredients.length).fill(false);
    function matchesStep(item, stepL) {
      const full = item.toLowerCase();
      if(stepL.includes(full)) return true;
      const dashIdx = item.indexOf(' - ');
      if(dashIdx !== -1 && stepL.includes(item.slice(dashIdx+3).toLowerCase())) return true;
      const sig = item.toLowerCase().split(/[\s\-]+/).filter(w=>w.length>=5);
      if(sig.length>=2 && sig.filter(w=>stepL.includes(w)).length>=2) return true;
      return false;
    }
    r.instructions.forEach((step,si)=>{
      if(si===0) return;
      const stepL = step.toLowerCase();
      r.ingredients.forEach((ing,ii)=>{
        if(assigned[ii]) return;
        if(matchesStep(ing.item, stepL)){ stepIngs[si].push(ing); assigned[ii]=true; }
      });
    });
    r.ingredients.forEach((ing,ii)=>{ if(!assigned[ii]) stepIngs[0].push(ing); });
    return stepIngs;
  }

  function buildCard(r) {
    const onMenu = r.onMenu !== false;
    const c = onMenu ? (CAT_COLOR[r.category]||DEFAULT_COLOR) : OFF_MENU;
    const stepIngs = assignIngredients(r);
    const bodyHTML = r.instructions.map((step,si)=>`
      <div class="cstep">
        <div class="srow">
          <span class="snum" style="background:${c.bg}">${si+1}</span>
          <span class="stxt">${step}</span>
        </div>
        ${stepIngs[si].length?`<div class="sings">${
          stepIngs[si].map(i=>`<div class="si-row">
            <span class="si-amt">${i.amount}</span>
            <span class="si-unit">${i.unit}</span>
            <span class="si-item">${i.item}</span>
          </div>`).join('')
        }</div>`:''}
      </div>`).join('') + (r.notes?`<div class="note">↳ ${r.notes}</div>`:'');
    return `<div class="card" style="border-left:4px solid ${c.border};background:${c.light}${onMenu?'':';opacity:.75'}">
      <div class="card-hdr" style="background:${c.bg}">
        <span class="card-name">${r.name}</span>
        ${!onMenu?'<span class="off-badge">OFF MENU</span>':''}
        ${(r.equipment||r.allergens)?`<div class="card-meta">${r.equipment?`<span class="card-equip">${r.equipment}</span>`:''}${r.allergens?`<span class="card-allerg">⚠ ${r.allergens}</span>`:''}</div>`:''}
      </div>
      <div class="card-body">${bodyHTML}</div>
    </div>`;
  }

  const sectionsHTML = cats.map((cat,ci)=>{
    const c = CAT_COLOR[cat]||DEFAULT_COLOR;
    // on-menu first, then off-menu; each group sorted alphabetically
    const recs = grouped[cat].sort((a,b)=>{
      const aOn = a.onMenu!==false, bOn = b.onMenu!==false;
      if(aOn!==bOn) return aOn?-1:1;
      return a.name.localeCompare(b.name);
    });
    return `<div class="section${ci>0?' pg-break':''}">
      <div class="sec-banner" style="background:${c.bg};border-bottom:3px solid ${c.border}">
        <span class="sec-brand">AQUI CAL-MEX</span>
        <span class="sec-title">${cat}</span>
        <span class="sec-count">${recs.length} recipe${recs.length!==1?'s':''}</span>
      </div>
      <div class="grid">${recs.map(r=>buildCard(r)).join('')}</div>
    </div>`;
  }).join('');

  const win = window.open('','_blank','width=1000,height=750');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>${title} — Aqui Cal-Mex Bar Recipes</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;background:#ddd;color:#111;padding:12px}
    .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .top-bar h1{font-size:11px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.06em}
    button.print-btn{padding:5px 14px;background:#333;border:none;border-radius:4px;font-weight:700;cursor:pointer;font-size:10px;color:#fff}
    .section{margin-bottom:16px}
    .pg-break{page-break-before:always;margin-top:0}
    .sec-banner{display:flex;align-items:center;gap:12px;padding:6px 12px;margin-bottom:8px;border-radius:4px 4px 0 0}
    .sec-brand{font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase}
    .sec-title{font-size:13px;font-weight:900;color:#fff;flex:1;text-align:center}
    .sec-count{font-size:8px;color:rgba(255,255,255,.6);font-weight:600}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    .card{border-radius:3px;overflow:hidden;border:1px solid #ccc;break-inside:avoid}
    .card-hdr{padding:4px 8px 3px;display:flex;flex-direction:column;gap:2px}
    .card-name{font-size:9.5px;font-weight:800;color:#fff;text-decoration:underline;text-underline-offset:2px;line-height:1.2;word-break:break-word}
    .off-badge{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-size:7px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:10px;margin-top:1px;align-self:flex-start}
    .card-meta{display:flex;gap:8px;flex-wrap:wrap}
    .card-equip{font-size:7.5px;color:rgba(255,255,255,.75);font-weight:600}
    .card-allerg{font-size:7.5px;color:#ffcc44;font-weight:700}
    .card-body{padding:4px 8px 6px}
    .cstep{margin-bottom:3px}
    .srow{display:flex;align-items:flex-start;gap:5px;line-height:1.35;padding:1px 0}
    .snum{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:15px;height:15px;border-radius:50%;font-size:7.5px;font-weight:900;color:#fff;margin-top:1px}
    .stxt{font-size:10.5px;color:#111;line-height:1.4}

    @page{size:landscape;margin:10mm}

}

/* ════════════════════════════════════════
   ADD / EDIT
════════════════════════════════════════ */
function openAdd(){
  if(!adminUnlocked){ toggleAdmin(); return; }
  editingId = null;
  document.getElementById('editTitle').textContent = 'Add Recipe';
  document.getElementById('eName').value = '';
  document.getElementById('eCat').value = activeTab;
  document.getElementById('eYields').value = '';
  document.getElementById('eAllergens').value = '';
  document.getElementById('eEquip').value = '';
  document.getElementById('eNotes').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  buildIngRows([{amount:'',unit:'fl oz',item:''}]);
  buildStepRows(['']);
  document.getElementById('editOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('eName').focus(),80);
}

function openEdit(id){
  if(!adminUnlocked){ toggleAdmin(); return; }
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  document.getElementById('editTitle').textContent = 'Edit Recipe';
  document.getElementById('eName').value = r.name;
  document.getElementById('eCat').value = r.category;
  document.getElementById('eYields').value = r.yields;
  document.getElementById('eAllergens').value = r.allergens||'';
  document.getElementById('eEquip').value = r.equipment||'';
  document.getElementById('eNotes').value = r.notes||'';
  document.getElementById('deleteBtn').style.display = '';
  buildIngRows(r.ingredients.length ? r.ingredients : [{amount:'',unit:'fl oz',item:''}]);
  buildStepRows(r.instructions.length ? r.instructions : ['']);
  document.getElementById('editOverlay').classList.add('open');
}
function closeEdit(){ document.getElementById('editOverlay').classList.remove('open'); }

/* ingredient rows */
function buildIngRows(ings){
  document.getElementById('ingRows').innerHTML = ings.map((i,idx)=>`
    <div class="ir">
      <input type="text" value="${x(i.amount)}" placeholder="2">
      <input type="text" value="${x(i.unit)}"   placeholder="fl oz">
      <input type="text" value="${x(i.item)}"   placeholder="Ingredient…">
      <button class="rm" onclick="rmIng(${idx})">✕</button>
    </div>`).join('');
}
function addIng(){
  const rows = getIngs(); rows.push({amount:'',unit:'fl oz',item:''});
  buildIngRows(rows);
  document.getElementById('ingRows').lastElementChild.querySelectorAll('input')[2].focus();
}
function rmIng(idx){
  const r = getIngs(); r.splice(idx,1);
  buildIngRows(r.length?r:[{amount:'',unit:'fl oz',item:''}]);
}
function getIngs(){
  return [...document.getElementById('ingRows').querySelectorAll('.ir')].map(row=>{
    const i = row.querySelectorAll('input');
    return {amount:i[0].value, unit:i[1].value, item:i[2].value};
  });
}

/* step rows */
function buildStepRows(steps){
  document.getElementById('stepRows').innerHTML = steps.map((s,idx)=>`
    <div class="sr">
      <div class="snum">${idx+1}</div>
      <input type="text" value="${x(s)}" placeholder="Step ${idx+1}…">
      <button class="rm" onclick="rmStep(${idx})">✕</button>
    </div>`).join('');
}
function addStep(){
  const s = getSteps(); s.push('');
  buildStepRows(s);
  document.getElementById('stepRows').lastElementChild.querySelector('input').focus();
}
function rmStep(idx){
  const s = getSteps(); s.splice(idx,1);
  buildStepRows(s.length?s:['']);
}
function getSteps(){
  return [...document.getElementById('stepRows').querySelectorAll('input')].map(i=>i.value);
}

function x(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function saveRecipe(){
  const name = document.getElementById('eName').value.trim();
  if(!name){ showToast('Please enter a recipe name'); return; }
  const existing = editingId ? recipes.find(r=>r.id===editingId) : null;
  const recipe = {
    id: editingId || nextId(),
    category: document.getElementById('eCat').value,
    name,
    yields: document.getElementById('eYields').value.trim(),
    allergens: document.getElementById('eAllergens').value.trim(),
    equipment: document.getElementById('eEquip').value.trim(),
    ingredients: getIngs().filter(i=>i.item.trim()),
    instructions: getSteps().filter(s=>s.trim()),
    notes: document.getElementById('eNotes').value.trim(),
    onMenu: existing ? existing.onMenu : true
  };
  if(editingId){
    recipes[recipes.findIndex(r=>r.id===editingId)] = recipe;
    showToast('Recipe updated ✓');
  } else {
    recipes.push(recipe);
    showToast('Recipe added ✓');
  }
  saveData(); closeEdit(); buildTabs(); render();
}

function deleteRecipe(){
  if(!adminUnlocked || !editingId) return;
  const r = recipes.find(x=>x.id===editingId);
  if(!confirm(`Delete "${r.name}"? This cannot be undone.`)) return;
  recipes = recipes.filter(x=>x.id!==editingId);
  saveData(); closeEdit(); buildTabs(); render();
  showToast('Recipe deleted');
}

/* ════════════════════════════════════════
   ADMIN LOCK
════════════════════════════════════════ */
let adminUnlocked = false;
const PIN_KEY = 'aqui_admin_pin';

function getPin(){ return localStorage.getItem(PIN_KEY) || '1234'; }

function toggleAdmin(){
  if(adminUnlocked){
    // Show options screen instead of immediately locking
    document.getElementById('pinTitle').textContent = '🔓 Admin Options';
    document.getElementById('pinLoginSection').style.display = 'none';
    document.getElementById('pinOptionsSection').style.display = '';
    document.getElementById('changePinUI').style.display = 'none';
    document.getElementById('pinOverlay').classList.add('open');
  } else {
    document.getElementById('pinTitle').textContent = '🔒 Admin Login';
    document.getElementById('pinLoginSection').style.display = '';
    document.getElementById('pinOptionsSection').style.display = 'none';
    document.getElementById('changePinUI').style.display = 'none';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    document.getElementById('pinOverlay').classList.add('open');
    setTimeout(()=>document.getElementById('pinInput').focus(), 80);
  }
}

function lockAdmin(){
  if(typeof bmIsEditing!=='undefined'&&bmIsEditing){bmIsEditing=false;document.body.classList.remove('bm-editing');const b=document.querySelector('.bm-btn-edit');if(b)b.textContent='✏️ Edit Menu';}
  adminUnlocked = false;
  document.getElementById('pinOverlay').classList.remove('open');
  updateAdminUI();
  buildTabs(); render();
  showToast('Admin locked 🔒');
}

function submitPin(){
  const val = document.getElementById('pinInput').value;
  if(val === getPin()){
    adminUnlocked = true;
    document.getElementById('pinOverlay').classList.remove('open');
    updateAdminUI();
    buildTabs(); render();
    showToast('Admin unlocked 🔓');
    // If PIN was entered from the bar menu tab, activate bar menu edit mode
    if(activeTab === '__barMenu__' && !bmIsEditing){
      bmIsEditing = true;
      document.body.classList.add('bm-editing');
      const b = document.querySelector('.bm-btn-edit');
      if(b) b.textContent = '✅ Done Editing';
    }
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN — try again';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

function updateAdminUI(){
  const btn = document.getElementById('lockBtn');
  const addBtn = document.getElementById('addRecipeBtn');
  if(adminUnlocked){
    btn.textContent = '🔓 Admin';
    btn.classList.add('unlocked');
    addBtn.style.display = '';
  } else {
    btn.textContent = '🔒 Admin';
    btn.classList.remove('unlocked');
    addBtn.style.display = 'none';
  }
}

function showChangePinUI(){
  document.getElementById('pinOptionsSection').style.display = 'none';
  document.getElementById('changePinUI').style.display = '';
  document.getElementById('pinTitle').textContent = '🔑 Change PIN';
  document.getElementById('newPin1').value = '';
  document.getElementById('newPin2').value = '';
  document.getElementById('newPin1').focus();
}

function saveNewPin(){
  const p1 = document.getElementById('newPin1').value;
  const p2 = document.getElementById('newPin2').value;
  if(!p1){ showToast('Enter a new PIN'); return; }
  if(p1 !== p2){ showToast('PINs do not match'); return; }
  localStorage.setItem(PIN_KEY, p1);
  document.getElementById('changePinUI').style.display = 'none';
  document.getElementById('pinOverlay').classList.remove('open');
  showToast('PIN updated ✓');
}

/* ════════════════════════════════════════
   IMPORT / EXPORT
════════════════════════════════════════ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aqui-recipes-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('Recipes exported ✓');
}
function importJSON(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      if(confirm(`Import ${data.length} recipes? This replaces the current database.`)){
        recipes = data; saveData(); buildTabs(); render();
        showToast(`Imported ${data.length} recipes ✓`);
      }
    }catch(e){ showToast('Import failed — invalid JSON file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ════════════════════════════════════════
   UTILITIES
════════════════════════════════════════ */
function closeIfBg(e,id){ if(e.target.id===id) document.getElementById(id).classList.remove('open'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.getElementById('viewOverlay').classList.remove('open');
    document.getElementById('editOverlay').classList.remove('open');
    document.getElementById('pinOverlay').classList.remove('open');
  }
});

  loadData();

}
if(document.readyState==='loading'){

} else {

}

let bmData = (function(){
  try { var s=localStorage.getItem('aqui-menu-v2'); return s?JSON.parse(s):JSON.parse(JSON.stringify(MENU_DEFAULT)); }
  catch(e){ return JSON.parse(JSON.stringify(MENU_DEFAULT)); }
})();

function bmSave(){ localStorage.setItem('aqui-menu-v2', JSON.stringify(bmData)); }

function bmResetToDefaults(){
  if(!confirm('Reset bar menu to original? All changes will be lost.')) return;
  bmData = JSON.parse(JSON.stringify(MENU_DEFAULT));
  bmSave(); bmRenderAll();
}

/* ── Section wrapper ── */
function bmSecWrap(title, inner){
  return '<div class="bm-section"><div class="bm-section-header"><div class="bm-section-line"></div><div class="bm-section-title">'+title+'</div><div class="bm-section-line"></div></div>'+inner+'</div>';
}

/* ── Item list ── */
function bmItemHtml(items, sid, subIdx){
  var sk = subIdx!==undefined ? 'sub-'+subIdx : 'main';
  return items.map(function(item,i){
    return '<div class="bm-menu-item"><span class="bm-item-name">'+item+'</span>'+
      '<button class="bm-edit-btn edt" onclick="bmEditItem(\''+sid+'\',\''+sk+'\','+i+')">✏️</button>'+
      '<button class="bm-edit-btn del" onclick="bmDeleteItem(\''+sid+'\',\''+sk+'\','+i+')">🗑</button></div>';
  }).join('');
}
function bmAddFormHtml(sid, subIdx){
  var sk = subIdx!==undefined ? 'sub-'+subIdx : 'main';
  return '<div class="bm-add-form"><input type="text" id="bmnew-'+sid+'-'+sk+'" placeholder="New item…"><button class="bm-add-btn" onclick="bmAddSimple(\''+sid+'\',\''+sk+'\')">+ Add</button></div>';
}

/* ── Page 1 ── */
function bmRenderPage1(){
  var html = '';
  bmData.page1.forEach(function(s){
    if(s.type==='subsections'){
      var cols = s.subsections.map(function(sub,si){
        return '<div class="bm-subsection"><div class="bm-subsection-title">'+sub.name+'</div>'+bmItemHtml(sub.items,s.id,si)+bmAddFormHtml(s.id,si)+'</div>';
      }).join('');
      html += bmSecWrap(s.title,'<div class="bm-subsection-grid">'+cols+'</div>');
    } else if(s.type==='two-col'){
      function mkCol(c){ return bmSecWrap(c.title,'<div class="bm-item-list">'+bmItemHtml(c.items,c.id)+bmAddFormHtml(c.id)+'</div>'); }
      html += '<div class="bm-split-row">'+mkCol(s.left)+mkCol(s.right)+'</div>';
    } else if(s.type==='beers'){
      var cols = s.columns.map(function(col,ci){
        var items = col.map(function(item,i){
          return '<div class="bm-menu-item"><span class="bm-item-name">'+item+'</span>'+
            '<button class="bm-edit-btn edt" onclick="bmEditBeer('+ci+','+i+')">✏️</button>'+
            '<button class="bm-edit-btn del" onclick="bmDeleteBeer('+ci+','+i+')">🗑</button></div>';
        }).join('');
        return '<div>'+items+'<div class="bm-add-form"><input type="text" id="bmnew-beer-'+ci+'" placeholder="New beer…"><button class="bm-add-btn" onclick="bmAddBeer('+ci+')">+ Add</button></div></div>';
      }).join('');
      html += bmSecWrap(s.title,'<div class="bm-beer-grid">'+cols+'</div>');
    } else if(s.type==='wines'){
      var cols = s.subsections.map(function(sub,si){
        var items = sub.items.map(function(item,i){
          return '<div class="bm-menu-item"><span class="bm-item-name">'+item+'</span>'+
            '<button class="bm-edit-btn edt" onclick="bmEditWine('+si+','+i+')">✏️</button>'+
            '<button class="bm-edit-btn del" onclick="bmDeleteWine('+si+','+i+')">🗑</button></div>';
        }).join('');
        return '<div><div class="bm-wine-sub-title">'+sub.name+'</div>'+items+
          '<div class="bm-add-form"><input type="text" id="bmnew-wine-'+si+'" placeholder="New wine…"><button class="bm-add-btn" onclick="bmAddWine('+si+')">+ Add</button></div></div>';
      }).join('');
      html += bmSecWrap(s.title,'<div class="bm-wine-grid">'+cols+'</div>');
    }
  });
  html += '<div class="bm-footer-note">Please drink responsibly.<br>House rule: Limit of 2 Industrial Drinks and a designated driver or ride-share service. 09/2025</div>';
  document.getElementById('bmPage1').innerHTML = html;
}

/* ── Page 2 ── */
function bmRenderPage2(){
  var martinis  = bmData.page2.martinis;
  var specialty = bmData.page2.specialty;
  function mkCards(arr, type){
    return arr.map(function(c,i){
      return '<div><div class="bm-cocktail-name">'+c.name+
        '<button class="bm-edit-btn edt" onclick="bmEditCocktail(\''+type+'\','+i+')">✏️</button>'+
        '<button class="bm-edit-btn del" onclick="bmDeleteCocktail(\''+type+'\','+i+')">🗑</button></div>'+
        '<div class="bm-cocktail-desc">'+c.desc+'</div></div>';
    }).join('');
  }
  document.getElementById('bmPage2').innerHTML =
    '<div class="bm-logo-area"><img src="'+BM_LOGO+'" alt="Aqui Natural Wild Organic" class="bm-logo-img"></div>'+
    bmSecWrap('HANDMADE MARTINI CRAFT SWIRLS',
      '<div class="bm-cocktail-grid">'+mkCards(martinis,'martinis')+'</div>'+
      '<div class="bm-add-form" style="margin-top:10px"><input type="text" id="bmnew-martini-name" placeholder="Martini name…"><textarea id="bmnew-martini-desc" placeholder="Ingredients…"></textarea><button class="bm-add-btn" onclick="bmAddCocktail(&quot;martinis&quot;)">+ Add Martini</button></div>')+
    bmSecWrap('SPECIALTY HANDCRAFTED DRINKS',
      '<div class="bm-cocktail-grid">'+mkCards(specialty,'specialty')+'</div>'+
      '<div class="bm-add-form" style="margin-top:10px"><input type="text" id="bmnew-specialty-name" placeholder="Drink name…"><textarea id="bmnew-specialty-desc" placeholder="Ingredients…"></textarea><button class="bm-add-btn" onclick="bmAddCocktail(&quot;specialty&quot;)">+ Add Drink</button></div>');
}

function bmRenderAll(){ bmRenderPage1(); bmRenderPage2(); }

/* ── Edit mode (PIN-gated) ── */
var bmIsEditing = false;
function bmToggleEdit(){
  if(!bmIsEditing && !adminUnlocked){
    document.getElementById('pinOverlay').classList.add('open');
    document.getElementById('pinInput').value = '';
    document.getElementById('pinError').textContent = '';
    showToast('Enter Admin PIN to edit the bar menu');
    return;
  }
  bmIsEditing = !bmIsEditing;
  document.body.classList.toggle('bm-editing', bmIsEditing);
  document.querySelector('.bm-btn-edit').textContent = bmIsEditing ? '✅ Done Editing' : '✏️ Edit Menu';
}

/* ── Data helpers ── */
function bmGetSec(id){
  for(var i=0;i<bmData.page1.length;i++){
    var s=bmData.page1[i];
    if(s.id===id) return s;
    if(s.type==='two-col'){ if(s.left.id===id) return s.left; if(s.right.id===id) return s.right; }
  }
  return null;
}
function bmEditItem(sid,sk,i){
  var sec=bmGetSec(sid);
  var cur=sk.indexOf('sub-')===0?sec.subsections[+sk.replace('sub-','')].items[i]:sec.items[i];
  bmOpenModal('Edit Item',cur,null,function(n){ if(sk.indexOf('sub-')===0) sec.subsections[+sk.replace('sub-','')].items[i]=n; else sec.items[i]=n; bmSave();bmRenderAll(); });
}
function bmDeleteItem(sid,sk,i){
  if(!confirm('Remove?')) return;
  var sec=bmGetSec(sid);
  if(sk.indexOf('sub-')===0) sec.subsections[+sk.replace('sub-','')].items.splice(i,1); else sec.items.splice(i,1);
  bmSave();bmRenderAll();
}
function bmAddSimple(sid,sk){
  var el=document.getElementById('bmnew-'+sid+'-'+sk);
  if(!el||!el.value.trim()) return;
  var sec=bmGetSec(sid);
  if(sk.indexOf('sub-')===0) sec.subsections[+sk.replace('sub-','')].items.push(el.value.trim()); else sec.items.push(el.value.trim());
  bmSave();bmRenderAll();
}
function bmGetBeers(){ return bmData.page1.filter(function(s){return s.id==='beers';})[0]; }
function bmEditBeer(ci,i){ var b=bmGetBeers(); bmOpenModal('Edit Beer',b.columns[ci][i],null,function(n){b.columns[ci][i]=n;bmSave();bmRenderAll();}); }
function bmDeleteBeer(ci,i){ if(!confirm('Remove?')) return; bmGetBeers().columns[ci].splice(i,1); bmSave();bmRenderAll(); }
function bmAddBeer(ci){ var el=document.getElementById('bmnew-beer-'+ci); if(!el||!el.value.trim()) return; bmGetBeers().columns[ci].push(el.value.trim()); bmSave();bmRenderAll(); }
function bmGetWines(){ return bmData.page1.filter(function(s){return s.id==='wines';})[0]; }
function bmEditWine(si,i){ var w=bmGetWines(); bmOpenModal('Edit Wine',w.subsections[si].items[i],null,function(n){w.subsections[si].items[i]=n;bmSave();bmRenderAll();}); }
function bmDeleteWine(si,i){ if(!confirm('Remove?')) return; bmGetWines().subsections[si].items.splice(i,1); bmSave();bmRenderAll(); }
function bmAddWine(si){ var el=document.getElementById('bmnew-wine-'+si); if(!el||!el.value.trim()) return; bmGetWines().subsections[si].items.push(el.value.trim()); bmSave();bmRenderAll(); }
function bmEditCocktail(type,i){ var c=bmData.page2[type][i]; bmOpenModal('Edit',c.name,c.desc,function(n,d){bmData.page2[type][i]={name:n,desc:d};bmSave();bmRenderAll();}); }
function bmDeleteCocktail(type,i){ if(!confirm('Remove?')) return; bmData.page2[type].splice(i,1); bmSave();bmRenderAll(); }
function bmAddCocktail(type){
  var key=type==='martinis'?'martini':'specialty';
  var n=document.getElementById('bmnew-'+key+'-name');
  var d=document.getElementById('bmnew-'+key+'-desc');
  if(!n||!n.value.trim()) return;
  bmData.page2[type].push({name:n.value.trim(),desc:d?d.value.trim():''});
  bmSave();bmRenderAll();
}

/* ── Modal ── */
var _bmCb=null,_bmHasDesc=false;
function bmOpenModal(title,name,desc,cb){
  _bmCb=cb; _bmHasDesc=desc!==null;
  document.getElementById('bmModalTitle').textContent=title;
  document.getElementById('bmModalName').value=name||'';
  document.getElementById('bmModalDesc').value=desc||'';
  document.getElementById('bmModalDescWrap').style.display=_bmHasDesc?'block':'none';
  document.getElementById('bmModal').classList.add('open');
  setTimeout(function(){document.getElementById('bmModalName').focus();},50);
}
function bmCloseModal(){ document.getElementById('bmModal').classList.remove('open'); _bmCb=null; }
function bmSaveModal(){
  var n=document.getElementById('bmModalName').value.trim();
  var d=document.getElementById('bmModalDesc').value.trim();
  if(!n) return;
  if(_bmCb) _bmCb(n,d);
  bmCloseModal();
}
document.getElementById('bmModal').addEventListener('click',function(e){ if(e.target.id==='bmModal') bmCloseModal(); });

/* ── PDF download ── */
async function bmDownloadPDF(){
  var btn=document.getElementById('bmDlBtn');
  btn.textContent='⏳ Building…'; btn.disabled=true;
  var wasE=bmIsEditing;
  if(wasE){bmIsEditing=false;document.body.classList.remove('bm-editing');}
  try{
    await document.fonts.ready;
    var jsPDF=window.jspdf.jsPDF;
    var pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'letter'});
    var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    var pages=[document.getElementById('bmPage1'),document.getElementById('bmPage2')];
    for(var i=0;i<pages.length;i++){
      if(i>0) pdf.addPage();
      var c=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
      var img=c.toDataURL('image/png');
      var m=18,mw=pw-m*2,mh=ph-m*2,r=c.width/c.height,w=mw,h=mw/r;
      if(h>mh){h=mh;w=mh*r;}
      pdf.addImage(img,'PNG',(pw-w)/2,(ph-h)/2,w,h);
    }
    pdf.save('aqui-bar-menu.pdf');
  }catch(err){alert('PDF failed — check internet connection.');console.error(err);}
  finally{
    if(wasE){bmIsEditing=true;document.body.classList.add('bm-editing');}
    btn.textContent='⬇ Download PDF'; btn.disabled=false;
  }
}

bmRenderAll();
